spring.application.name=bidding-service
server.port=8001

jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:jwt-public.pem}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5001/db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.group-id=bidding-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vaultx.bidding.dto.event.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map

grpc.client.user-service.address=static://${GRPC_USER_SERVICE_HOST:localhost}:9000
grpc.client.user-service.negotiation-type=PLAINTEXT
grpc.server.port=9001

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# → S3 / LocalStack media storage (presigned uploads) ──────────────
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:4566}
app.storage.presign-external-endpoint=${STORAGE_PRESIGN_ENDPOINT:http://localhost:4566}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:4566/vaultx-media}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.bucket=${STORAGE_BUCKET:vaultx-media}
app.storage.access-key=${STORAGE_ACCESS_KEY:test}
app.storage.secret-key=${STORAGE_SECRET_KEY:test}
app.storage.path-style-access=true
app.storage.max-image-bytes=${MAX_IMAGE_BYTES:10485760}
app.storage.max-video-bytes=${MAX_VIDEO_BYTES:104857600}
app.storage.max-images-per-auction=${MAX_IMAGES_PER_AUCTION:10}
app.storage.max-videos-per-auction=${MAX_VIDEOS_PER_AUCTION:3}
app.storage.presign-ttl-seconds=${PRESIGN_TTL_SECONDS:900}

# → Auction archive retention ─────────────────────────────────────
app.auction.archive-sold-after-days=${ARCHIVE_SOLD_AFTER_DAYS:90}
app.auction.archive-unsold-after-days=${ARCHIVE_UNSOLD_AFTER_DAYS:30}

logging.pattern.level=%5p [${spring.application.name:bidding-service},%X{traceId:-},%X{spanId:-}]

# S3/LocalStack storage
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:4566}
app.storage.presign-external-endpoint=${STORAGE_PRESIGN_ENDPOINT:http://localhost:4566}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:4566/vaultx-media}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.bucket=${STORAGE_BUCKET:vaultx-media}
app.storage.access-key=${STORAGE_ACCESS_KEY:test}
app.storage.secret-key=${STORAGE_SECRET_KEY:test}
app.storage.path-style-access=true
app.storage.max-image-bytes=${MAX_IMAGE_BYTES:10485760}
app.storage.max-video-bytes=${MAX_VIDEO_BYTES:104857600}
app.storage.max-images-per-auction=${MAX_IMAGES_PER_AUCTION:10}
app.storage.max-videos-per-auction=${MAX_VIDEOS_PER_AUCTION:3}
app.storage.presign-ttl-seconds=${PRESIGN_TTL_SECONDS:900}