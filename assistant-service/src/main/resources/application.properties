spring.application.name=assistant-service
server.port=8004

# ── Ollama (local, no container) ──────────────────────────────
app.assistant.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.assistant.model=${ASSISTANT_MODEL:qwen3:8b}
app.assistant.temperature=${ASSISTANT_TEMPERATURE:0.2}
app.assistant.max-iterations=${ASSISTANT_MAX_ITERATIONS:4}

# ── Vaultx APIs (via gateway) ────────────────────────────────
app.assistant.gateway-url=${GATEWAY_URL:http://localhost:8080}

# ── Redis ────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ── Security / JWT (verify the token, read the subject) ──────
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:jwt-public.pem}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
