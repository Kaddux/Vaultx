spring.application.name=assistant-service
server.port=8004


app.assistant.llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
app.assistant.model=${ASSISTANT_MODEL:gemini-3.6-flash}
app.assistant.api-key=${ASSISTANT_API_KEY:}
app.assistant.temperature=${ASSISTANT_TEMPERATURE:0.2}
app.assistant.max-iterations=${ASSISTANT_MAX_ITERATIONS:4}


app.assistant.gateway-url=${GATEWAY_URL:http://localhost:8080}


spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}


jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:jwt-public.pem}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
