spring.application.name=transaction-service
server.port=8002

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5002/db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

grpc.server.port=9002

grpc.client.user-service.address=static://${GRPC_USER_SERVICE_HOST:localhost}:9000
grpc.client.user-service.negotiation-type=PLAINTEXT

grpc.client.bidding-service.address=static://${GRPC_BIDDING_SERVICE_HOST:localhost}:9001
grpc.client.bidding-service.negotiation-type=PLAINTEXT

spring.kafka.consumer.group-id=transaction-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging.pattern.level=%5p [${spring.application.name:transaction-service},%X{traceId:-},%X{spanId:-}]